name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'web/**'
      - 'wrangler.toml'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'migrations/**'
      - '.github/workflows/deploy-workers.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'wrangler.toml'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'migrations/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

concurrency:
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    name: Deploy to Cloudflare workerd
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          missing=""
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "${{ secrets.D1_DATABASE_ID }}" ]; then missing="$missing D1_DATABASE_ID"; fi
          if [ -n "$missing" ]; then
            echo "Missing required secrets:$missing"
            exit 1
          fi

      - name: Configure D1 database id
        run: |
          if ! grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            echo "D1 database id placeholder not found in wrangler.toml"
            exit 1
          fi
          sed -i "s|REPLACE_WITH_D1_DATABASE_ID|${{ secrets.D1_DATABASE_ID }}|" wrangler.toml

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.122.0'
          command: d1 migrations apply stock-fetcher --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.122.0'
          command: deploy
